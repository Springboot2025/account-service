spring:
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB
      file-size-threshold: 2MB
  datasource:
    url: jdbc:postgresql:///legalpro?cloudSqlInstance=ecstatic-seeker-474703-d4:australia-southeast2:legalpro-postgres-au&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: legalpro
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

logging:
  level:
    org.springframework.web.multipart: DEBUG
    org.apache.catalina.core: DEBUG

server:
  port: ${PORT:8080}
  address: 0.0.0.0

google:
  api:
    key: ${GOOGLE_API_KEY}

payway:
  base-url: ${PAYWAY_BASE_URL:https://api.payway.com.au/rest/v1}
  secret-key: ${PAYWAY_SECRET_KEY:}
  publishable-key: ${PAYWAY_PUBLISHABLE_KEY:}
  merchant-id: ${PAYWAY_MERCHANT_ID:}
  auto-renew-enabled: ${PAYWAY_RENEWAL_AUTO_ENABLED:false}
  renewal-cron: ${PAYWAY_RENEWAL_CRON:0 0 2 * * *}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    custom-js: /swagger-ui/custom-login.js

